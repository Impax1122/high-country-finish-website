[build]
  publish = "."
  # The relay tests run on every deploy, so a routing regression fails the build.
  command = "node build.js --check && node scripts/test-clickup-relay.js && node scripts/test-gmail-relay.js && node scripts/test-gmail-wake.js"

# Keep internal links as /page.html so they match the canonical tags and sitemap.
# With pretty_urls on, Netlify rewrote every link to /page while canonicals said /page.html,
# which split ranking signals across two URLs for every page (both returned 200).
[build.processing.html]
  pretty_urls = false

# Canonical trade URL is /trade.html. pretty_urls is off, so this rewrite
# is what makes /trade itself return 200.
[[redirects]]
  from = "/trade"
  to = "/trade.html"
  status = 200

# Repo tooling and internal notes live in scripts/ and docs/ — never serve them.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

# Function source is not a page. The live endpoints are /.netlify/functions/clickup-relay
# and /.netlify/functions/gmail-relay.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

# Google Apps Script source for the Gmail wake script. Not a page.
[[redirects]]
  from = "/automation/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/partials/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/build.js"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.gitignore"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io; form-action 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Bot wake-up relays (ClickUp and Gmail). Netlify deploys netlify/functions
# separately from the static site; the directory is not published as site files.
[functions]
  directory = "netlify/functions"
